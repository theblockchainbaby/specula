[package]
name = "specula-edit"
description = "Specula edit CLI — applies a Tier-A edit to TSX source and re-emits it."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "specula-edit"
path = "src/main.rs"

[dependencies]
specula-core = { path = "../specula-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

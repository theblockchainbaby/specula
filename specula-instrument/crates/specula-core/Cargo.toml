[package]
name = "specula-core"
description = "Specula instrumentation core — one path algorithm, two modes (transform / analyze)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
swc_core = { version = "66.0.2", features = ["ecma_ast", "ecma_parser", "ecma_visit", "ecma_codegen", "common"] }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Enables `serde::Serialize` on the map types. Off by default so the wasm
# plugin (which only needs the transform) stays lean; `specula-analyze`
# turns it on to emit JSON.
serde = ["dep:serde"]

[dev-dependencies]

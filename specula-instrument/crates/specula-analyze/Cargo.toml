[package]
name = "specula-analyze"
description = "Specula analyze-mode CLI — reads TSX on stdin, emits the JSON source map."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "specula-analyze"
path = "src/main.rs"

[dependencies]
specula-core = { path = "../specula-core", features = ["serde"] }
serde_json = "1"
